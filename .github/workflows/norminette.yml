name: CI for 42 Project

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  norminette:
    name: Run Norminette
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Norminette
        run: pip install norminette

      - name: Run Norminette
        run: norminette src/ libft/ include/

  build:
    name: Build MiniLibX and Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc make xorg libxext-dev libx11-dev libbsd-dev

      - name: Clone and compile MiniLibX
        run: |
          git clone https://github.com/42Paris/minilibx-linux.git mlx
          make -C mlx

      - name: Run Makefile
        run: make
